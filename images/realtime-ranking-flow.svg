<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">스냅샷 기반 실시간 랭킹 조회 흐름</title>
  <desc id="desc">주기적으로 생성한 랭킹 스냅샷과 사용자의 최신 점수를 결합해 개인화된 주변 랭킹을 만드는 과정</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111a31"/>
    </linearGradient>
    <linearGradient id="result" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000814" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="560" rx="28" fill="url(#background)"/>
  <g opacity=".12" stroke="#94a3b8">
    <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200M0 420H1200M0 490H1200"/>
    <path d="M100 0V560M200 0V560M300 0V560M400 0V560M500 0V560M600 0V560M700 0V560M800 0V560M900 0V560M1000 0V560M1100 0V560"/>
  </g>

  <text x="70" y="64" fill="#f8fafc" font-family="Pretendard, system-ui, sans-serif" font-size="26" font-weight="700">비싼 계산은 주기적으로, 최신성은 조회할 때</text>
  <text x="70" y="96" fill="#94a3b8" font-family="Pretendard, system-ui, sans-serif" font-size="17">전체를 다시 정렬하지 않고 사용자가 납득할 수 있는 주변 랭킹을 만든다</text>

  <g filter="url(#shadow)">
    <rect x="70" y="146" width="270" height="126" rx="18" fill="#15213a" stroke="#334155"/>
    <circle cx="108" cy="184" r="14" fill="#8b5cf6"/>
    <text x="136" y="190" fill="#f8fafc" font-family="Pretendard, system-ui, sans-serif" font-size="20" font-weight="700">랭킹 스냅샷</text>
    <text x="100" y="226" fill="#a5b4fc" font-family="Pretendard, system-ui, sans-serif" font-size="16">전체 순위 · 점수 구간 · 경계</text>
    <text x="100" y="251" fill="#64748b" font-family="Pretendard, system-ui, sans-serif" font-size="14">배치에서 미리 계산</text>

    <rect x="70" y="328" width="270" height="126" rx="18" fill="#15213a" stroke="#334155"/>
    <circle cx="108" cy="366" r="14" fill="#22d3ee"/>
    <text x="136" y="372" fill="#f8fafc" font-family="Pretendard, system-ui, sans-serif" font-size="20" font-weight="700">사용자의 최신 점수</text>
    <text x="100" y="408" fill="#67e8f9" font-family="Pretendard, system-ui, sans-serif" font-size="16">현재 원본 데이터</text>
    <text x="100" y="433" fill="#64748b" font-family="Pretendard, system-ui, sans-serif" font-size="14">조회 시 한 명만 확인</text>

    <rect x="465" y="208" width="270" height="184" rx="22" fill="#17223b" stroke="#475569"/>
    <text x="600" y="255" fill="#f8fafc" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="20" font-weight="700">점수 구간에서 위치 계산</text>
    <rect x="503" y="282" width="194" height="42" rx="10" fill="#0f172a"/>
    <circle cx="532" cy="303" r="7" fill="#818cf8"/>
    <circle cx="558" cy="303" r="7" fill="#818cf8"/>
    <circle cx="584" cy="303" r="9" fill="#22d3ee"/>
    <circle cx="612" cy="303" r="7" fill="#818cf8"/>
    <circle cx="638" cy="303" r="7" fill="#818cf8"/>
    <circle cx="664" cy="303" r="7" fill="#818cf8"/>
    <text x="600" y="358" fill="#94a3b8" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="15">전체 스캔 없이 최신 점수를 삽입</text>

    <rect x="860" y="188" width="270" height="224" rx="22" fill="url(#result)" stroke="#38bdf8"/>
    <text x="995" y="235" fill="#ffffff" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="20" font-weight="700">개인화된 주변 랭킹</text>
    <g font-family="Pretendard, system-ui, sans-serif" font-size="16">
      <text x="905" y="285" fill="#bae6fd">19위</text><text x="974" y="285" fill="#e0f2fe">30,100점</text>
      <rect x="892" y="303" width="206" height="42" rx="10" fill="#ffffff" fill-opacity=".16"/>
      <text x="905" y="330" fill="#ffffff" font-weight="700">20위 · 나</text><text x="1010" y="330" fill="#ffffff" font-weight="700">30,050점</text>
      <text x="905" y="378" fill="#bae6fd">21위</text><text x="974" y="378" fill="#e0f2fe">30,000점</text>
    </g>
  </g>

  <path d="M340 209 C400 209 405 258 465 270" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M340 391 C400 391 405 342 465 330" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M735 300 H852" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
