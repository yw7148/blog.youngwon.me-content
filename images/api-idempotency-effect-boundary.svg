<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">완료 상태 전이와 부수 효과를 함께 기록하는 멱등성 경계</title>
  <desc id="desc">완료 요청이 오면 하나의 데이터베이스 트랜잭션에서 상태 전이와 outbox 이벤트를 함께 기록하고, 반복 전달되는 이벤트는 소비자가 고유 키로 한 번만 적용한다.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111a31"/>
    </linearGradient>
    <linearGradient id="transaction" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13263c"/>
      <stop offset="1" stop-color="#12344a"/>
    </linearGradient>
    <linearGradient id="effect" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000814" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="1200" height="650" rx="28" fill="url(#background)"/>
  <g opacity=".1" stroke="#94a3b8">
    <path d="M0 82H1200M0 164H1200M0 246H1200M0 328H1200M0 410H1200M0 492H1200M0 574H1200"/>
    <path d="M100 0V650M200 0V650M300 0V650M400 0V650M500 0V650M600 0V650M700 0V650M800 0V650M900 0V650M1000 0V650M1100 0V650"/>
  </g>

  <text x="64" y="62" fill="#f8fafc" font-family="Pretendard, system-ui, sans-serif" font-size="27" font-weight="700">멱등성의 경계는 상태 변경에서 끝나지 않는다</text>
  <text x="64" y="96" fill="#94a3b8" font-family="Pretendard, system-ui, sans-serif" font-size="17">상태 전이와 부수 효과의 실행 의도를 함께 커밋하고, 전달 재시도도 안전하게 만든다</text>

  <g filter="url(#shadow)" font-family="Pretendard, system-ui, sans-serif">
    <rect x="58" y="184" width="216" height="94" rx="18" fill="#15213a" stroke="#334155"/>
    <text x="166" y="222" fill="#f8fafc" text-anchor="middle" font-size="18" font-weight="700">완료 요청</text>
    <text x="166" y="250" fill="#94a3b8" text-anchor="middle" font-size="14">interaction-123</text>

    <rect x="58" y="322" width="216" height="78" rx="18" fill="#111b30" stroke="#475569" stroke-dasharray="7 6"/>
    <text x="166" y="354" fill="#cbd5e1" text-anchor="middle" font-size="16" font-weight="700">같은 요청의 재시도</text>
    <text x="166" y="379" fill="#64748b" text-anchor="middle" font-size="13">전이는 다시 일어나지 않음</text>

    <rect x="350" y="142" width="450" height="328" rx="24" fill="url(#transaction)" stroke="#22d3ee" stroke-width="2"/>
    <rect x="382" y="167" width="386" height="44" rx="12" fill="#0e7490"/>
    <text x="575" y="196" fill="#ffffff" text-anchor="middle" font-size="18" font-weight="700">하나의 DB 트랜잭션</text>

    <rect x="392" y="244" width="366" height="78" rx="16" fill="#0f172a" stroke="#38bdf8"/>
    <circle cx="426" cy="283" r="14" fill="#0891b2"/>
    <text x="426" y="289" fill="#ffffff" text-anchor="middle" font-size="15" font-weight="700">1</text>
    <text x="458" y="276" fill="#f8fafc" font-size="17" font-weight="700">상태 전이</text>
    <text x="458" y="302" fill="#7dd3fc" font-size="14">ONGOING → COMPLETED</text>

    <rect x="392" y="346" width="366" height="78" rx="16" fill="#0f172a" stroke="#38bdf8"/>
    <circle cx="426" cy="385" r="14" fill="#0891b2"/>
    <text x="426" y="391" fill="#ffffff" text-anchor="middle" font-size="15" font-weight="700">2</text>
    <text x="458" y="378" fill="#f8fafc" font-size="17" font-weight="700">후속 작업의 실행 의도 기록</text>
    <text x="458" y="404" fill="#7dd3fc" font-size="14">outbox: completion event</text>

    <rect x="876" y="156" width="266" height="112" rx="20" fill="#17223b" stroke="#64748b"/>
    <text x="1009" y="196" fill="#f8fafc" text-anchor="middle" font-size="18" font-weight="700">Outbox 전달</text>
    <text x="1009" y="224" fill="#94a3b8" text-anchor="middle" font-size="14">실패하면 반복 전송 가능</text>
    <text x="1009" y="247" fill="#64748b" text-anchor="middle" font-size="13">at-least-once delivery</text>

    <rect x="876" y="344" width="266" height="126" rx="20" fill="url(#effect)" stroke="#2dd4bf"/>
    <text x="1009" y="381" fill="#ccfbf1" text-anchor="middle" font-size="15">효과 소비자</text>
    <text x="1009" y="413" fill="#ffffff" text-anchor="middle" font-size="19" font-weight="700">고유 키로 한 번만 적용</text>
    <text x="1009" y="443" fill="#99f6e4" text-anchor="middle" font-size="14">interactionId + effectType</text>
  </g>

  <path d="M274 231H342" fill="none" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrowCyan)"/>
  <path d="M274 361C314 361 314 312 350 312" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <path d="M800 212H868" fill="none" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrowCyan)"/>
  <text x="834" y="194" fill="#67e8f9" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="13">commit</text>
  <path d="M1009 268V336" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="58" y="526" width="1084" height="72" rx="16" fill="#0f172a" stroke="#334155"/>
  <circle cx="94" cy="562" r="12" fill="#22d3ee"/>
  <text x="120" y="557" fill="#f8fafc" font-family="Pretendard, system-ui, sans-serif" font-size="16" font-weight="700">보장하는 것</text>
  <text x="120" y="580" fill="#cbd5e1" font-family="Pretendard, system-ui, sans-serif" font-size="14">정확히 한 번 전달이 아니라, 반복 전달돼도 상태와 효과가 한 번 적용된 것처럼 수렴하는 것</text>
</svg>
